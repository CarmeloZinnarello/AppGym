<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titolo }}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="manifest" href="/static/manifest.json">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'Segoe UI',sans-serif;

            min-height:80vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background: linear-gradient(
                90deg,
                #041b4d 0%,
                #041b4d 50%,
                #f2b705 50%,
                #f2b705 100%
            );

            overflow-x:hidden;

            position:relative;
        }

        /* IMMAGINE SOLO LATO GIALLO */

      body::after{

		content:"";

		position:fixed;

		right:0;
		bottom:0;

		width:50vw;     /* SOLO metà schermo */
		height:100vh;

		background-image:url('{{ url_for("static", filename="sfondo.png") }}');

		background-repeat:no-repeat;

		background-position:bottom center;

		background-size:cover;

		opacity:0.48;

		z-index:0;

		pointer-events:none;
	}

      .container {

    flex-grow: 1;

    overflow-y: auto;

    padding: 20px 20px;

    background: none;

    
    border-radius: 24px;

	box-shadow: none;
	border: none;

    max-width: 90%;

    margin: 20px auto;

    text-align: center;

    position: relative;

    z-index: 2;
}

        header{

            text-align:center;

            margin-bottom:30px;
        }

        .logo{

            width:120px;
            height:120px;

            object-fit:cover;

            border-radius:50%;

            border:4px solid #041b4d;

            background:#f2b705;

            padding:5px;

            margin-bottom:20px;

            box-shadow:0 8px 25px rgba(0,0,0,0.25);
        }

        h1{

            color:white;

            font-size:2.2rem;

            font-weight:800;

            margin-bottom:10px;

            letter-spacing:0.5px;
        }

        .subtitle{

            color:white;

            font-size:1.3rem;

            margin-bottom:30px;
        }

        .subtitle span{

            color:#041b4d;

            font-weight:bold;
        }

        .login-form{

            background:rgba(4,27,77,0.96);

            padding:35px;

            border-radius:28px;

            box-shadow:0 10px 35px rgba(0,0,0,0.35);

            border:1px solid rgba(255,255,255,0.08);

            backdrop-filter:blur(10px);
        }

        .login-form form{

            display:flex;

            flex-direction:column;
        }

        .login-form label{

            color:#f2b705;

            margin-bottom:8px;

            font-weight:700;

            margin-top:15px;

            font-size:0.95rem;
        }

        .login-form input{

            width:100%;

            padding:16px;

            border-radius:14px;

            border:1px solid rgba(255,255,255,0.08);

            background:rgba(255,255,255,0.06);

            color:white;

            font-size:1rem;

            outline:none;

            transition:0.2s;
        }

        .login-form input:focus{

            border-color:#f2b705;

            box-shadow:0 0 0 3px rgba(242,183,5,0.15);
        }

        .login-form input::placeholder{

            color:rgba(255,255,255,0.45);
        }

        .login-form button{

            margin-top:30px;

            background:#f2b705;

            color:#041b4d;

            border:none;

            padding:16px;

            border-radius:14px;

            font-size:1.1rem;

            font-weight:800;

            cursor:pointer;

            transition:all 0.25s ease;
        }

        .login-form button:hover{

            background:#ffd028;

            transform:translateY(-2px);

            box-shadow:0 8px 20px rgba(242,183,5,0.35);
        }

        .flash-messages{

            margin-top:20px;
        }

        .flash-messages p{

            padding:12px;

            border-radius:10px;

            margin-bottom:10px;

            text-align:center;

            font-weight:600;
        }

        .success{

            background:rgba(46,204,113,0.15);

            color:#2ecc71;
        }

        .danger,
        .error{

            background:rgba(231,76,60,0.15);

            color:#ff6b6b;
        }

        /* MOBILE */

        @media screen and (max-width:768px){

            body{

                align-items:flex-start;

                padding-top:40px;
            }

          body::after{

			width:50vw;   /* SEMPRE SOLO META' */

			height:100vh;

			right:0;

			bottom:0;

			opacity:0.50;

			background-position:center bottom;

			background-size:cover;
		}

            .container{

                padding:15px;
            }

            .logo{

                width:90px;

                height:90px;
            }

            h1{

                font-size:1.8rem;
            }

            .subtitle{

                font-size:1rem;
            }

            .login-form{

                padding:25px;

                border-radius:24px;
            }

            .login-form input{

                padding:14px;
            }

            .login-form button{

                padding:14px;

                font-size:1rem;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <header>

        <img
            src="{{ url_for('static', filename='logo.png') }}"
            alt="Logo"
            class="logo"
        >

        <h1>{{ titolo }}</h1>

        <div class="subtitle">
            Dott.&<span>Coach</span>
        </div>

    </header>

    <section class="login-form">

        <form method="POST" action="{{ url_for('home.home') }}">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Inserisci il tuo username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Inserisci la tua password"
                required
            >

            <button type="submit">
                ACCEDI
            </button>

        </form>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}

        <div class="flash-messages">

            {% for category, message in messages %}

                <p class="{{ category }}">
                    {{ message }}
                </p>

            {% endfor %}

        </div>

        {% endif %}
        {% endwith %}

    </section>

</div>

</body>
</html>
