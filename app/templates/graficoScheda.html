<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafico Progressi</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Segoe UI',sans-serif;

            background:#041b4d;

            min-height:100vh;

            padding:40px 20px;

            color:white;
        }

        .container{
            width:100%;
            max-width:1100px;
            margin:auto;
        }

        .nav-bar{
            display:flex;
            justify-content:flex-end;
            margin-bottom:25px;
        }

        .nav-bar a{
            text-decoration:none;

            background:#f2b705;

            color:#041b4d;

            padding:12px 18px;

            border-radius:12px;

            font-weight:700;

            transition:0.25s;
        }

        .nav-bar a:hover{
            transform:translateY(-2px);

            background:#ffd028;

            box-shadow:0 8px 20px rgba(242,183,5,0.35);
        }

        .page-title{
            text-align:center;

            color:white;

            font-size:2.4rem;

            font-weight:800;

            margin-bottom:30px;
        }

        .chart-card{

            background:rgba(4,27,77,0.95);

            border-radius:28px;

            padding:30px;

            box-shadow:0 10px 35px rgba(0,0,0,0.35);

            border:1px solid rgba(255,255,255,0.08);

            backdrop-filter:blur(10px);
        }

        .controls{
            margin-bottom:25px;
        }

        label{
            display:block;

            margin-bottom:10px;

            font-weight:600;

            color:white;
        }

        select{
            width:100%;

            background:rgba(255,255,255,0.08);

            border:1px solid rgba(255,255,255,0.12);

            color:white;

            border-radius:12px;

            padding:12px 14px;

            font-size:1rem;

            outline:none;
        }

        select option{
            background:#041b4d;
            color:white;
        }

        canvas{

            background:rgba(255,255,255,0.04);

            border:1px solid rgba(255,255,255,0.08);

            border-radius:20px;

            padding:20px;

            width:100% !important;

            max-height:500px;
        }

        @media screen and (max-width:768px){

            body{
                padding:20px 10px;
            }

            .page-title{
                font-size:1.8rem;
            }

            .chart-card{
                padding:18px;
                border-radius:22px;
            }

            .nav-bar{
                justify-content:center;
            }

            .nav-bar a{
                width:100%;
                text-align:center;
            }

            canvas{
                padding:10px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <div class="nav-bar">

        <a href="{% if current_user.is_admin %}{{ url_for('admin.manage_schede') }}{% else %}{{ url_for('user.manage_schede') }}{% endif %}">

            <i class="fas fa-arrow-left"></i>
            Torna alle Schede

        </a>

    </div>

    <h1 class="page-title">

        <i class="fas fa-chart-line"></i>
        Progressi Allenamento

    </h1>

    <div class="chart-card">

        <div class="controls">

            <label for="selectEsercizio">
                Seleziona esercizio:
            </label>

            <select id="selectEsercizio"></select>

        </div>

        <canvas id="grafico"></canvas>

    </div>

</div>

<script>

const dati = {{ grafico | tojson }};

const select = document.getElementById("selectEsercizio");

let chart;

// Popola dropdown

for (const esercizio in dati) {

    const opt = document.createElement("option");

    opt.value = esercizio;

    opt.textContent = esercizio;

    select.appendChild(opt);
}

function aggiornaGrafico(nome) {

    const dataset = dati[nome];

    const labels = dataset.map(d => d.label);

    const kg = dataset.map(d => d.kg);

    const reps = dataset.map(d => d.reps);

    if (chart) chart.destroy();

    chart = new Chart(document.getElementById('grafico'), {

        type: 'line',

        data: {

            labels: labels,

            datasets: [

                {
                    label: 'Kg',

                    data: kg,

                    borderColor: '#f2b705',

                    backgroundColor: 'rgba(242,183,5,0.15)',

                    borderWidth: 3,

                    tension: 0.3,

                    pointBackgroundColor: '#f2b705',

                    pointRadius: 4
                },

                {
                    label: 'Ripetizioni',

                    data: reps,

                    borderColor: '#4fc3f7',

                    backgroundColor: 'rgba(79,195,247,0.12)',

                    borderWidth: 3,

                    tension: 0.3,

                    borderDash: [6, 6],

                    pointBackgroundColor: '#4fc3f7',

                    pointRadius: 4
                }

            ]
        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            plugins: {

                legend: {

                    labels: {

                        color: 'white',

                        font: {
                            size: 14
                        }
                    }
                }
            },

            scales: {

                x: {

                    ticks: {
                        color: 'white'
                    },

                    grid: {
                        color: 'rgba(255,255,255,0.08)'
                    }
                },

                y: {

                    ticks: {
                        color: 'white'
                    },

                    grid: {
                        color: 'rgba(255,255,255,0.08)'
                    }
                }
            }
        }
    });
}

// Cambio esercizio

select.addEventListener("change", function() {

    aggiornaGrafico(this.value);

});

// Primo caricamento

window.onload = function() {

    if (select.options.length > 0) {

        aggiornaGrafico(select.value);

    }
};

</script>

</body>
</html>
