<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifica Peso</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Segoe UI',sans-serif;
            min-height:100vh;
            background:linear-gradient(90deg,#041b4d 100%,#f2b705 0%);
            padding:20px;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .page-wrapper{
            width:100%;
            max-width:600px;
        }

        .back-button{
            margin-bottom:20px;
        }

        .back-button a{
            text-decoration:none;
            background:#f2b705;
            color:#041b4d;
            padding:10px 18px;
            border-radius:10px;
            font-weight:700;
            display:inline-flex;
            align-items:center;
            gap:8px;
        }

        .card{
            background:rgba(4,27,77,0.95);
            border-radius:24px;
            padding:30px;
            box-shadow:0 10px 35px rgba(0,0,0,.3);
            border:1px solid rgba(255,255,255,.08);
            backdrop-filter:blur(10px);
        }

        h1{
            color:white;
            text-align:center;
            margin-bottom:25px;
        }

        .info{
            text-align:center;
            color:white;
            margin-bottom:25px;
            font-size:1rem;
        }

        .info strong{
            color:#f2b705;
        }

        label{
            display:block;
            color:#f2b705;
            font-weight:700;
            margin-bottom:8px;
        }

        input{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:white;
            font-size:16px;
            margin-bottom:20px;
        }

        .buttons{
            display:flex;
            gap:12px;
            flex-wrap:wrap;
        }

        .btn{
            flex:1;
            min-width:140px;
            border:none;
            padding:14px;
            border-radius:12px;
            font-weight:700;
            cursor:pointer;
            transition:.25s;
            text-decoration:none;
            text-align:center;
        }

        .btn-save{
            background:#f2b705;
            color:#041b4d;
        }

        .btn-save:hover{
            background:#ffd028;
        }

        .btn-cancel{
            background:rgba(255,255,255,.08);
            color:white;
        }

        .btn-cancel:hover{
            background:rgba(255,255,255,.15);
        }

    </style>

</head>

<body>

<div class="page-wrapper">

    <div class="back-button">

        <a href="{{ url_for('user.peso') }}">
            <i class="fas fa-arrow-left"></i>
            Torna allo Storico
        </a>

    </div>

    <div class="card">

        <h1>
            <i class="fas fa-pen"></i>
            Modifica Peso
        </h1>

        <div class="info">

            Rilevazione del

            <strong>
                {{ peso.data_inserimento.strftime('%d/%m/%Y %H:%M') }}
            </strong>

        </div>

        <form method="POST">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <label>
                <i class="fas fa-weight"></i>
                Peso (Kg)
            </label>

            <input
                type="number"
                step="0.1"
                name="peso"
                value="{{ peso.peso }}"
                required>
			<label>
			<i class="fas fa-calendar"></i>
				Data Inserimento
			</label>

			<input
				type="datetime-local"
				name="data_inserimento"
				value="{{ peso.data_inserimento.strftime('%Y-%m-%dT%H:%M') }}"
				required>
            <div class="buttons">

                <button type="submit"
                        class="btn btn-save">

                    <i class="fas fa-save"></i>
                    Salva Modifiche

                </button>

                <a href="{{ url_for('user.peso') }}"
                   class="btn btn-cancel">

                    <i class="fas fa-times"></i>
                    Annulla

                </a>

            </div>
		
        </form>
	
    </div>

</div>

</body>
</html>
