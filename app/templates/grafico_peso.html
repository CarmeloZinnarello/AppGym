<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andamento Peso</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Segoe UI',sans-serif;
            background:#041b4d;
            min-height:100vh;
            padding:40px 20px;
            color:white;
        }

        .container{
            width:100%;
            max-width:1100px;
            margin:auto;
        }

        .nav-bar{
            display:flex;
            justify-content:flex-end;
            margin-bottom:25px;
        }

        .nav-bar a{
            text-decoration:none;
            background:#f2b705;
            color:#041b4d;
            padding:12px 18px;
            border-radius:12px;
            font-weight:700;
            transition:0.25s;
        }

        .nav-bar a:hover{
            transform:translateY(-2px);
            background:#ffd028;
            box-shadow:0 8px 20px rgba(242,183,5,0.35);
        }

        .page-title{
            text-align:center;
            color:white;
            font-size:2.4rem;
            font-weight:800;
            margin-bottom:30px;
        }

        .chart-card{
            background:rgba(4,27,77,0.95);
            border-radius:28px;
            padding:30px;
            box-shadow:0 10px 35px rgba(0,0,0,0.35);
            border:1px solid rgba(255,255,255,0.08);
            backdrop-filter:blur(10px);
        }

        .controls{
            margin-bottom:25px;
        }

        label{
            display:block;
            margin-bottom:10px;
            font-weight:600;
            color:white;
        }

        .filter-row{
            display:flex;
            gap:12px;
            flex-wrap:wrap;
        }

        .filter-row input{
            flex:1;
            min-width:120px;
            background:rgba(255,255,255,0.08);
            border:1px solid rgba(255,255,255,0.12);
            color:white;
            border-radius:12px;
            padding:12px 14px;
            font-size:1rem;
            outline:none;
        }

        .filter-row button{
            background:#f2b705;
            color:#041b4d;
            border:none;
            border-radius:12px;
            padding:12px 20px;
            font-weight:700;
            cursor:pointer;
            transition:0.25s;
        }

        .filter-row button:hover{
            transform:translateY(-2px);
            background:#ffd028;
        }

        .stats{
            display:flex;
            gap:20px;
            margin-bottom:25px;
            flex-wrap:wrap;
        }

        .stat-card{
            flex:1;
            min-width:220px;
            background:rgba(255,255,255,0.06);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:18px;
            padding:20px;
            text-align:center;
        }

        .stat-card h3{
            color:#f2b705;
            margin-bottom:10px;
        }

        .stat-card span{
            font-size:2rem;
            font-weight:700;
        }

        .chart-container{
            position:relative;
            height:500px;
        }

        canvas{
            background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:20px;
            padding:20px;
        }

        @media screen and (max-width:768px){

            body{
                padding:20px 10px;
            }

            .page-title{
                font-size:1.8rem;
            }

            .chart-card{
                padding:18px;
                border-radius:22px;
            }

            .nav-bar{
                justify-content:center;
            }

            .nav-bar a{
                width:100%;
                text-align:center;
            }

            .chart-container{
                height:350px;
            }

            canvas{
                padding:10px;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <div class="nav-bar">

        <a href="{% if current_user.is_admin %}{{ url_for('admin.manage_users') }}{% else %}{{ url_for('user.dashboard') }}{% endif %}">

            <i class="fas fa-arrow-left"></i>
            Torna indietro

        </a>

    </div>

    <h1 class="page-title">

        <i class="fas fa-weight-scale"></i>
        Andamento Peso

    </h1>

    <div class="chart-card">

        <div class="controls">

            <label for="limite">
                Numero pesi da visualizzare
            </label>

            <div class="filter-row">

                <input
                    type="number"
                    id="limite"
                    min="1"
                    value="{{ limite }}"
                    placeholder="Numero record">

                <button id="btnAggiorna">
                    Aggiorna
                </button>

            </div>

        </div>

        <div class="stats">

            <div class="stat-card">

                <h3>Media Peso</h3>

                <span>{{ media }} Kg</span>

            </div>

            <div class="stat-card">

                <h3>Ultimo Peso</h3>

                <span>{{ ultimo_peso }} Kg</span>

            </div>

        </div>

        <div class="chart-container">

            <canvas id="graficoPeso"></canvas>

        </div>

    </div>

</div>

<script>

const labels = {{ labels | tojson }};
const valori = {{ valori | tojson }};

new Chart(document.getElementById('graficoPeso'), {

    type: 'line',

    data: {

        labels: labels,

        datasets: [

            {

                label: 'Peso (Kg)',

                data: valori,

                borderColor: '#f2b705',

                backgroundColor: 'rgba(242,183,5,0.15)',

                borderWidth: 3,

                tension: 0.3,

                fill: true,

                pointBackgroundColor: '#f2b705',

                pointRadius: 5

            }

        ]

    },

    options: {

        responsive: true,

        maintainAspectRatio: false,

        plugins: {

            legend: {

                labels: {

                    color: 'white',

                    font: {
                        size: 14
                    }

                }

            }

        },

        scales: {

            x: {

                ticks: {
                    color: 'white'
                },

                grid: {
                    color: 'rgba(255,255,255,0.08)'
                }

            },

            y: {

                ticks: {
                    color: 'white'
                },

                grid: {
                    color: 'rgba(255,255,255,0.08)'
                }

            }

        }

    }

});

document.getElementById('btnAggiorna').addEventListener('click', function(){

    const limite = document.getElementById('limite').value;

    if(!limite || limite < 1){
        return;
    }

   window.location =
    "{{ url_for('user.grafico_peso', user_id=user_id) }}?limite=" + limite;

});

document.getElementById('limite').addEventListener('keypress', function(e){

    if(e.key === 'Enter'){

        document.getElementById('btnAggiorna').click();

    }

});

</script>

</body>
</html>
