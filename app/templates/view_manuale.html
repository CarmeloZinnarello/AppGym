<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manuale</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

html,
body {
    margin: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
}

.nav-bar {
    padding: 10px;
    background: #f5f5f5;
    display: flex;
    gap: 15px;
    align-items: center;
}

.nav-bar a {
    text-decoration: none;
    color: #041b4d;
    font-weight: 600;
}

.pdf-container {
    flex: 1;
}

embed {
    width: 100%;
    height: 100%;
    border: none;
}

</style>

</head>

<body>

<div class="nav-bar">

```
<a href="{% if current_user.is_admin %}{{ url_for('admin.manage_users') }}{% else %}{{ url_for('user.dashboard') }}{% endif %}">

    {% if current_user.is_admin %}
        Torna alla gestione utenti
    {% else %}
        Torna alla home
    {% endif %}

</a>

<a href="{{ url_for('static', filename='uploads/user/' + filename) }}?v={{ version }}"
   target="_blank">

    Apri in nuova scheda

</a>
```

</div>

<div class="pdf-container" id="pdfContainer"></div>

<script>

const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

const pdfUrl =
"{{ url_for('static', filename='uploads/user/' + filename) }}?v={{ version }}";

if (isIOS) {

    // iPhone / iPad
    window.location.href = pdfUrl;

} else {

    // Android / Desktop
    document.getElementById("pdfContainer").innerHTML = `
        <embed src="${pdfUrl}" type="application/pdf">
    `;

}

</script>

</body>
</html>
